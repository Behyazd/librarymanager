{% extends 'library/base.html' %}

{% block title %}همگام‌سازی{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin: 0 0 16px 0;">🔄 همگام‌سازی (Sync)</h2>

    <!-- وضعیت -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px;">
        <div style="background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 2rem; font-weight: 700;" id="pending-count">0</div>
            <div style="font-size: 0.9rem;">در انتظار ارسال</div>
        </div>
        <div style="background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 2rem; font-weight: 700;" id="conflicts-count">0</div>
            <div style="font-size: 0.9rem;">تعارض</div>
        </div>
        <div style="background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 2rem; font-weight: 700;" id="books-count">0</div>
            <div style="font-size: 0.9rem;">کتاب محلی</div>
        </div>
        <div style="background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 0.9rem;">آخرین Sync</div>
            <div style="font-size: 0.85rem; margin-top: 4px;" id="last-sync">هرگز</div>
        </div>
    </div>

    <!-- وضعیت اتصال -->
    <div style="padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 16px; text-align: center; font-weight: 600;" id="connection-status">
        🌐 در حال بررسی...
    </div>

    <!-- دکمه‌ها -->
    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
        <button class="btn btn-primary" onclick="pushChanges()" id="push-btn" style="flex: 1; min-width: 200px;">
            ⬆️ ارسال به سرور
        </button>
        <button class="btn" style="background: var(--accent-500); color: #fff; flex: 1; min-width: 200px;" onclick="pullChanges()" id="pull-btn">
            ⬇️ دریافت از سرور
        </button>
        <button class="btn" style="background: var(--success); color: #fff; flex: 1; min-width: 200px;" onclick="fullSync()" id="full-sync-btn">
            🔄 Sync کامل
        </button>
    </div>

    <!-- لاگ -->
    <div style="background: var(--neutral-50); padding: 12px; border-radius: var(--radius-md); max-height: 300px; overflow-y: auto;">
        <strong>📋 لاگ Sync:</strong>
        <div id="sync-log" style="margin-top: 8px; font-size: 0.9rem;"></div>
    </div>
</div>

<script type="module">
import { pushChanges as push, pullChanges as pull, getPendingChanges, getBooks } from '/static/library/local-db.js';

async function updateStatus() {
    const pending = await getPendingChanges();
    const books = await getBooks();

    document.getElementById('pending-count').textContent = pending.length;
    document.getElementById('books-count').textContent = books.length;

    const isOnline = navigator.onLine;
    const connDiv = document.getElementById('connection-status');

    if (isOnline) {
        connDiv.textContent = '🌐 متصل به اینترنت';
        connDiv.style.background = 'oklch(94% 0.06 155)';
        connDiv.style.color = 'oklch(34% 0.14 155)';
    } else {
        connDiv.textContent = '📵 آفلاین';
        connDiv.style.background = 'oklch(94% 0.06 25)';
        connDiv.style.color = 'oklch(36% 0.18 25)';
    }
}

window.pushChanges = async () => {
    log('شروع ارسال...');
    try {
        const token = localStorage.getItem('access_token');
        const result = await push('/api', token);
        log(result.success ? `✅ ${result.results.length} تغییر ارسال شد` : `❌ خطا`);
    } catch (e) { log(`❌ ${e.message}`); }
    await updateStatus();
};

window.pullChanges = async () => {
    log('شروع دریافت...');
    try {
        const token = localStorage.getItem('access_token');
        const result = await pull('/api', token);
        log(result.success ? `✅ ${result.books.length} کتاب دریافت شد` : `❌ خطا`);
    } catch (e) { log(`❌ ${e.message}`); }
    await updateStatus();
};

window.fullSync = async () => {
    await window.pullChanges();
    await window.pushChanges();
};

function log(msg) {
    const div = document.getElementById('sync-log');
    const time = new Date().toLocaleTimeString('fa-IR');
    div.innerHTML = `<div style="padding: 4px 0; border-bottom: 1px solid var(--neutral-100);"><span style="color: var(--text-muted);">${time}</span> - ${msg}</div>` + div.innerHTML;
}

document.addEventListener('DOMContentLoaded', () => {
    updateStatus();
    setInterval(updateStatus, 10000);
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
});
</script>
{% endblock %}
