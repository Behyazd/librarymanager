{% extends 'library/base.html' %}

{% block title %}ویرایش کتاب{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin: 0 0 8px 0;">✏️ ویرایش کتاب</h2>
    <p style="color: var(--text-muted); margin-bottom: 16px;">
        در حال ویرایش: <strong>{{ book.title }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label for="title" style="display: block; font-weight: 600; margin-bottom: 4px;">عنوان *</label>
                <input type="text" id="title" name="title" required value="{{ book.title }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="subtitle" style="display: block; font-weight: 600; margin-bottom: 4px;">عنوان فرعی</label>
                <input type="text" id="subtitle" name="subtitle" value="{{ book.subtitle|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="author" style="display: block; font-weight: 600; margin-bottom: 4px;">نویسنده *</label>
                <input type="text" id="author" name="author" value="{{ book.author|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="author_dates" style="display: block; font-weight: 600; margin-bottom: 4px;">تاریخ نویسنده</label>
                <input type="text" id="author_dates" name="author_dates" value="{{ book.author_dates|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="isbn" style="display: block; font-weight: 600; margin-bottom: 4px;">شابک</label>
                <input type="text" id="isbn" name="isbn" value="{{ book.isbn|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="national_biblio_number" style="display: block; font-weight: 600; margin-bottom: 4px;">شماره کتابشناسی ملی</label>
                <input type="text" id="national_biblio_number" name="national_biblio_number" value="{{ book.national_biblio_number|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="publisher" style="display: block; font-weight: 600; margin-bottom: 4px;">ناشر</label>
                <input type="text" id="publisher" name="publisher" value="{{ book.publisher|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="publish_place" style="display: block; font-weight: 600; margin-bottom: 4px;">محل نشر</label>
                <input type="text" id="publish_place" name="publish_place" value="{{ book.publish_place|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="publish_year" style="display: block; font-weight: 600; margin-bottom: 4px;">سال نشر</label>
                <input type="text" id="publish_year" name="publish_year" value="{{ book.publish_year|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="pages" style="display: block; font-weight: 600; margin-bottom: 4px;">تعداد صفحه</label>
                <input type="text" id="pages" name="pages" value="{{ book.pages|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="dimensions" style="display: block; font-weight: 600; margin-bottom: 4px;">ابعاد</label>
                <input type="text" id="dimensions" name="dimensions" value="{{ book.dimensions|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="dewey_class" style="display: block; font-weight: 600; margin-bottom: 4px;">رده دیویی</label>
                <input type="text" id="dewey_class" name="dewey_class" value="{{ book.dewey_class|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="lcc_class" style="display: block; font-weight: 600; margin-bottom: 4px;">رده کنگره</label>
                <input type="text" id="lcc_class" name="lcc_class" value="{{ book.lcc_class|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="fapa" style="display: block; font-weight: 600; margin-bottom: 4px;">وضعیت فهرست‌نویسی</label>
                <input type="text" id="fapa" name="fapa" value="{{ book.fapa|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="location" style="display: block; font-weight: 600; margin-bottom: 4px;">محل قفسه</label>
                <input type="text" id="location" name="location" value="{{ book.location|default:'' }}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
            <div>
                <label for="total_copies" style="display: block; font-weight: 600; margin-bottom: 4px;">تعداد کل نسخه‌ها</label>
                <input type="number" id="total_copies" name="total_copies" value="{{ book.total_copies }}" min="1" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">
            </div>
        </div>

        <div style="margin-top: 12px;">
            <label for="subject" style="display: block; font-weight: 600; margin-bottom: 4px;">موضوعات</label>
            <textarea id="subject" name="subject" rows="3" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">{{ book.subject|default:'' }}</textarea>
        </div>

        <div style="margin-top: 12px;">
            <label for="notes" style="display: block; font-weight: 600; margin-bottom: 4px;">یادداشت</label>
            <textarea id="notes" name="notes" rows="3" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit;">{{ book.notes|default:'' }}</textarea>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
            <button type="submit" class="btn btn-primary">💾 ذخیره تغییرات</button>
            <a href="{% url 'library:book_detail' book.pk %}" class="btn btn-ghost">← انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
